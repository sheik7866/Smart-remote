name: smart_remote
description: "LG webOS TV remote for iOS, Android and web."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Material widgets, as recommended by Flutter 3.47+
  # (`package:flutter/material.dart` is deprecated in favour of this).
  flutter_secure_storage: ^11.2.0
  material_ui: ^1.1.0

  # App state, capability gating, discovery and reconnect. No Flutter inside.
  remote_core:
    path: ../../packages/remote_core

  # Native discovery helpers: Android multicast lock, iOS Bonjour.
  lg_discovery:
    path: ../../plugins/lg_discovery

  # Protocol layer: framing, pairing, commands, pointer input.
  webos_ssap:
    path: ../../packages/webos_ssap

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
